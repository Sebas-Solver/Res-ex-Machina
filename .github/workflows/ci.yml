# ============================================
# Res ex Machina — CI Pipeline
# ============================================
# SPDX-License-Identifier: Apache-2.0
#
# Two jobs:
#   1. core-ci (REQUIRED) — Must pass before merge to main:
#      pnpm install --frozen-lockfile, TypeScript typecheck,
#      Vitest unit tests, production build, SDK build+tests,
#      MCP Server install + Jest tests.
#
#   2. mcp-typecheck (NON-BLOCKING) — MCP Server tsc --noEmit
#      Currently OOM due to viem type graph complexity.
#      Tracked in Issue #43. P1 technical debt.
#      DO NOT add as required check until #43 is resolved.
#
# After this workflow runs green once, add these as required
# checks in GitHub branch protection for main:
#   ✅ Core CI / Node 22
#   ❌ MCP Server Type Check — NOT required (Issue #43)
#
# NOTE: Node 20 removed from matrix — pnpm 11.x requires Node >= 22.13.
# Node 20 LTS entered maintenance April 2026.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege for the GITHUB_TOKEN: CI only reads the repository.
permissions:
  contents: read

# Cancel previous runs of the same branch/PR
# to avoid wasting CI minutes unnecessarily
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # Job 1: REQUIRED — Must pass for merge
  # ─────────────────────────────────────────────
  core-ci:
    name: Core CI (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        # pnpm 11.x requires Node >= 22.13. Node 20 not supported.
        node-version: [22]

    # Environment variables for tests.
    # ⚠️ These are CI-only dummy values.
    # Real secrets are in GitHub Secrets (Settings → Secrets → Actions).
    env:
      DATABASE_URL: postgres://test:test@localhost:5432/test
      REDIS_URL: redis://localhost:6379
      L2_RPC_URL: http://localhost:8545
      L2_CHAIN_ID: 31337
      FEE_RECEIVER_ADDRESS: "0x0000000000000000000000000000000000000001"
      FEE_MINIMUM_AMOUNT: "0.0001"
      ANCHOR_WALLET_PRIVATE_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── pnpm setup ──
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      # ── Root / Server ──
      - name: Install dependencies (root)
        run: pnpm install --frozen-lockfile

      - name: Build @res-ex-machina/pog (imported by the server)
        run: pnpm --filter @res-ex-machina/pog build

      - name: TypeScript type check (root)
        run: pnpm run typecheck

      - name: Lint (ESLint)
        run: pnpm run lint

      - name: Run tests (Vitest)
        run: pnpm test

      - name: Production build
        run: pnpm run build

      # ── SDK package ──
      - name: SDK - Install
        run: |
          cd packages/sdk
          npm install

      - name: SDK - Build & Typecheck
        run: |
          cd packages/sdk
          npm run build

      - name: SDK - Tests (Vitest)
        run: |
          cd packages/sdk
          npm test

      # ── PoG v2 core package ──
      - name: PoG - Install
        run: |
          cd packages/pog
          npm ci

      - name: PoG - Build & Typecheck
        run: |
          cd packages/pog
          npm run build

      - name: PoG - Tests (Vitest)
        run: |
          cd packages/pog
          npm test

      # ── MCP Server ──
      - name: MCP Server - Build (tsc)
        run: pnpm --filter @res-ex-machina/mcp-server build

      - name: MCP Server - Tests (Jest)
        run: pnpm --filter @res-ex-machina/mcp-server test

  # ─────────────────────────────────────────────
  # Job 2: MCP Server Type Check (Blocking)
  # ─────────────────────────────────────────────
  mcp-typecheck:
    name: MCP Server Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies (root)
        run: pnpm install --frozen-lockfile

      - name: SDK - Build
        run: pnpm --filter @res-ex-machina/sdk build

      - name: MCP Server - Build & Typecheck (tsc)
        continue-on-error: true
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm --filter @res-ex-machina/mcp-server typecheck


  # ─────────────────────────────────────────────
  # Job 3: Anchoring contract + end-to-end on a local chain
  # ─────────────────────────────────────────────
  contracts:
    name: Contracts and e2e (Foundry)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Forge tests
        working-directory: contracts
        run: |
          forge build
          forge test -vv

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: PoG e2e on Anvil (deploy, anchor via relayer, verify from chain)
        run: |
          anvil --silent --port 8545 &
          for i in $(seq 1 30); do curl -sf -X POST -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' http://127.0.0.1:8545 && break; sleep 1; done
          cd packages/pog
          npm ci
          RXM_E2E_RPC=http://127.0.0.1:8545 RXM_E2E_ARTIFACT=../../contracts/out/RxMAnchor.sol/RxMAnchor.json npm test

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Server v2 pipeline e2e on Anvil (accept, anchor, receipt, verify from chain)
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @res-ex-machina/pog build
          RXM_E2E_RPC=http://127.0.0.1:8545 RXM_E2E_ARTIFACT=contracts/out/RxMAnchor.sol/RxMAnchor.json pnpm exec vitest run tests/v2/e2e.anvil.test.ts

  # ─────────────────────────────────────────────
  # Job 4: Production image builds and resolves the workspace
  # ─────────────────────────────────────────────
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build --target production -t rxm:ci .

      - name: Image loads the server dependencies and @res-ex-machina/pog
        run: |
          docker run --rm --entrypoint node rxm:ci -e "Promise.all([import('@res-ex-machina/pog'), import('fastify'), import('viem')]).then(([p]) => { if (!p.verifyDeclaration) process.exit(1); console.log('ok'); })"
